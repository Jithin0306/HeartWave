name: Release Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v1.3.15)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            name: 'Windows x64'
            args: ''
          - platform: 'macos-latest'
            name: 'macOS Apple Silicon (aarch64)'
            args: '--target aarch64-apple-darwin --bundles dmg,app'
          - platform: 'macos-latest'
            name: 'macOS Intel (x86_64)'
            args: '--target x86_64-apple-darwin --bundles dmg,app'
          - platform: 'ubuntu-22.04'
            name: 'Linux x64 (AppImage, deb, rpm)'
            args: '--bundles appimage,deb,rpm'

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm

      - name: Install NPM dependencies
        run: npm ci

      - name: Build Web Renderer
        run: npm run build:renderer

      - name: Read Release Notes
        id: notes
        shell: bash
        run: |
          if [ -f "RELEASE_NOTES.md" ]; then
            BODY=$(cat RELEASE_NOTES.md)
          else
            BODY="HeartWave multi-platform release."
          fi
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || 'HeartWaveRelease2026' }}
        with:
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: 'HeartWave __VERSION__'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
